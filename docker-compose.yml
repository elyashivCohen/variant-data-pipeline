# The default, auto-loaded Compose file - deliberately holds only the
# `tests` service, so `docker compose run --build --rm tests` works from a
# fresh shell with no RUN_ID set. The three pipeline stages live in
# docker-compose.pipeline.yml instead, because Compose interpolates every
# service's variables in a file up front, regardless of which service is
# targeted; if the pipeline's required `${RUN_ID:?...}` mounts were in this
# same file, this tests command would fail before RUN_ID is ever relevant.
#
# `tests` runs the Python unit test suite (tests/run_tests.py) inside the
# image - no RUN_ID, no volumes (real input/output data is never touched),
# no dependency on the pipeline services, no Docker socket. It is gated
# behind the "test" profile so it never starts as part of running the
# pipeline (see docker-compose.pipeline.yml / README, "Quick start").

services:
  tests:
    build: .
    image: identifai-pipeline:latest
    profiles: ["test"]
    entrypoint:
      - python
      - -B
      - tests/run_tests.py

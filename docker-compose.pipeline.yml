# One-shot batch services for the three pipeline stages, chained by Compose's
# own dependency graph (service_completed_successfully) - see README,
# "Architecture and data flow". This file is named docker-compose.pipeline.yml
# (not the Compose default) and always invoked with `-f docker-compose.pipeline.yml`,
# normally via run_pipeline.ps1, which allocates RUN_ID and passes it
# through. Keeping it out of the auto-loaded docker-compose.yml (which holds
# only the unrelated `tests` service, see that file) means running the tests
# never triggers this file's `${RUN_ID:?...}` requirement - Compose
# interpolates every service's variables in a file up front, regardless of
# which service is targeted, so the two would otherwise conflict.
#
# RUN_ID is required (`${RUN_ID:?...}`) so a direct
# `docker compose -f docker-compose.pipeline.yml run --rm <service>`
# invocation, without the launcher, cannot silently reuse a stale value;
# must be a plain directory name (letters, digits, "-", "_" only - no "/",
# "\", or ".." segments).
#
# INPUT_DIR is optional and defaults to ./input (the normal sample data);
# set it (the launcher's -InputDir parameter does this) to point Convert at
# a different directory of CSVs instead - see README, "Error-handling
# examples". Only `convert` reads it.
#
# PIPELINE_UID/PIPELINE_GID (optional, default 1000:1000, matching the
# image's non-root `appuser`) set the `user:` all three services run as -
# applied uniformly here in the compose file, not via a per-service
# `docker compose run --user` flag, because that flag only overrides the
# one service named on the command line, not the dependencies depends_on
# starts (verified directly - see README, "Non-root containers"). Needed on
# native Linux hosts where the host UID isn't 1000, so the host-created
# output/<RUN_ID>/ directories and the 0600-mode files each stage writes
# stay owned by, and readable by, the same UID across all three stages.
#
# Layout on the host, all under one run's directory:
#   output/<RUN_ID>/convert/    Convert's JSON output (written by convert)
#   output/<RUN_ID>/process/    Process's metrics output (written by process)
#   output/<RUN_ID>/aggregate/  Aggregate's summary.json (written by aggregate)
#   output/<RUN_ID>/logs/       convert.log, process.log, aggregate.log

services:
  convert:
    build: .
    image: identifai-pipeline:latest
    restart: "no"
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    command:
      - src.convert
      - --input-dir
      - /app/input
      - --output-dir
      - /app/run/convert
      - --log-file
      - /app/run/logs/convert.log
    volumes:
      - ${INPUT_DIR:-./input}:/app/input:ro
      - ./output/${RUN_ID:?RUN_ID must be set}/convert:/app/run/convert
      - ./output/${RUN_ID:?RUN_ID must be set}/logs:/app/run/logs

  process:
    build: .
    image: identifai-pipeline:latest
    restart: "no"
    depends_on:
      convert:
        condition: service_completed_successfully
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    environment:
      - PROCESS_SLEEP_SECONDS
    command:
      - src.process
      - --input-dir
      - /app/run/convert
      - --output-dir
      - /app/run/process
      - --log-file
      - /app/run/logs/process.log
    volumes:
      - ./output/${RUN_ID:?RUN_ID must be set}/convert:/app/run/convert:ro
      - ./output/${RUN_ID:?RUN_ID must be set}/process:/app/run/process
      - ./output/${RUN_ID:?RUN_ID must be set}/logs:/app/run/logs

  aggregate:
    build: .
    image: identifai-pipeline:latest
    restart: "no"
    depends_on:
      process:
        condition: service_completed_successfully
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    command:
      - src.aggregate
      - --convert-dir
      - /app/run/convert
      - --process-dir
      - /app/run/process
      - --output-file
      - /app/run/aggregate/summary.json
      - --log-file
      - /app/run/logs/aggregate.log
    volumes:
      - ./output/${RUN_ID:?RUN_ID must be set}/convert:/app/run/convert:ro
      - ./output/${RUN_ID:?RUN_ID must be set}/process:/app/run/process:ro
      - ./output/${RUN_ID:?RUN_ID must be set}/aggregate:/app/run/aggregate
      - ./output/${RUN_ID:?RUN_ID must be set}/logs:/app/run/logs
